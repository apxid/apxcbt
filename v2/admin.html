<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CBT Admin</title><script src="config.js"></script><script src="app.js"></script><style>
:root{--navy:#071737;--blue:#1f50f5;--lime:#c8ff00;--soft:#f4f7fc;--line:#dbe2f1;--ink:#12213e;--muted:#69758e;--red:#c7352e;--green:#16794b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:linear-gradient(135deg,#102b68,#07132f);color:var(--ink)}button,input,select{font:inherit}.wrap{min-height:100vh;padding:18px}.app{max-width:1180px;margin:auto;background:#fff;border-radius:22px;overflow:hidden;min-height:calc(100vh - 36px);box-shadow:0 24px 80px #05194540}.top{background:#102b8f;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:900}.brand small{display:block;color:#cdd8ff;margin-top:3px;font-size:10px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--lime);color:#07152d}.secondary{background:#e7ecf5;color:#263653}.danger{background:#ffe9e7;color:#9f261f}.grid{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 120px)}.side{padding:16px;background:#f5f7fc;border-right:1px solid var(--line)}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:10px;margin-bottom:6px;font-weight:800;color:#46516a;cursor:pointer}.nav.active,.nav:hover{background:#e7edff;color:#173aa8}.main{padding:22px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 5px 18px #12213e0a}.metric{font-size:25px;font-weight:950}.muted{color:var(--muted);font-size:11px}.section{display:none}.section.active{display:block}.table-wrap{overflow:auto;margin-top:14px;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;font-size:11px;min-width:700px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.table th{background:#f5f7fc}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:900}.ok{background:#e9f8f0;color:#16794b}.bad{background:#fff0ef;color:#a32b24}.warn{background:#fff7df;color:#805b11}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;font-size:10px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:#f7f9fd}.login{max-width:430px;margin:80px auto;background:#fff;padding:28px;border-radius:20px}.login h1{margin:0 0 6px}.field{margin-bottom:12px}.full{grid-column:1/-1}.hidden{display:none}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);opacity:0;background:#172747;color:white;padding:11px 15px;border-radius:10px;font-size:11px;transition:.2s;z-index:99}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:800px){.grid{grid-template-columns:1fr}.side{display:flex;overflow:auto}.nav{white-space:nowrap;width:auto}.cards{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.wrap{padding:0}.app{border-radius:0;min-height:100vh}}
</style></head><body><div id="loginPage" class="login"><h1>CBT Admin</h1><p class="muted">Kelola kegiatan, jadwal, token, ruang dan akun proktor.</p><div class="field"><label>Username</label><input id="username" value="admin"></div><div class="field"><label>PIN</label><input id="pin" type="password" value="admin123"></div><button class="btn primary" style="width:100%" onclick="login()">Masuk Admin</button></div><div id="app" class="wrap hidden"><div class="app"><header class="top"><div class="brand">CBT ADMIN<small id="who"></small></div><button class="btn secondary" onclick="logoutAuth()">Keluar</button></header><div class="grid"><aside class="side"><button class="nav active" data-tab="dash">Dashboard</button><button class="nav" data-tab="schedule">Jadwal</button><button class="nav" data-tab="proctor">Proktor</button><button class="nav" data-tab="room">Ruang/Lab</button><button class="nav" data-tab="monitor">Monitoring</button></aside><main class="main"><section id="dash" class="section active"><h2>Dashboard</h2><div id="metrics" class="cards"></div><div id="recent"></div></section><section id="schedule" class="section"><h2>Kelola Jadwal</h2><div class="card"><div class="form"><div class="field"><label>ID Jadwal (kosong = otomatis)</label><input id="sid"></div><div class="field"><label>Tanggal</label><input id="sdate" type="date" value="2026-10-05"></div><div class="field"><label>Kelas</label><input id="sclass" value="9A"></div><div class="field"><label>Ruang</label><select id="sroom"></select></div><div class="field"><label>Proktor</label><select id="sproctor"></select></div><div class="field"><label>Mata Pelajaran</label><input id="ssubject" value="Informatika"></div><div class="field"><label>Mulai</label><input id="sstart" type="time" value="07:30"></div><div class="field"><label>Selesai</label><input id="send" type="time" value="09:00"></div><div class="field"><label>Token</label><input id="stoken" value="TEST19"></div><div class="field"><label>Status</label><select id="sstatus"><option>AKTIF</option><option>NONAKTIF</option></select></div><div class="field full"><label>Google Form URL</label><input id="sform"></div></div><br><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="saveSchedule()">Simpan Jadwal</button><button class="btn secondary" onclick="generateToken($('sid').value)">Generate Token</button></div></div><div id="scheduleTable"></div></section><section id="proctor" class="section"><h2>Akun Proktor</h2><div class="card"><div class="form"><div class="field"><label>ID (kosong = otomatis)</label><input id="pid"></div><div class="field"><label>Username</label><input id="puser"></div><div class="field"><label>Nama</label><input id="pname"></div><div class="field"><label>PIN baru</label><input id="ppin" type="password"></div><div class="field"><label>Ruang</label><select id="proom"></select></div><div class="field"><label>Status</label><select id="pstatus"><option>AKTIF</option><option>NONAKTIF</option></select></div></div><br><button class="btn primary" onclick="saveProctor()">Simpan Proktor</button></div><div id="proctorTable"></div></section><section id="room" class="section"><h2>Ruang / Lab</h2><div class="card"><div class="form"><div class="field"><label>ID Ruang</label><input id="rid"></div><div class="field"><label>Nama Ruang</label><input id="rname"></div><div class="field"><label>Proktor ID</label><input id="rproctor"></div><div class="field"><label>Status</label><select id="rstatus"><option>AKTIF</option><option>NONAKTIF</option></select></div></div><br><button class="btn primary" onclick="saveRoom()">Simpan Ruang</button></div><div id="roomTable"></div></section><section id="monitor" class="section"><h2>Monitoring Global</h2><div id="monitorTable"></div></section></main></div></div></div><div id="toast" class="toast"></div><script>
let D=null;function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function login(){try{const h=await sha256($('pin').value);const d=await api('login',{username:$('username').value,pinHash:h,device:device()});if(!d.success)throw Error(d.message);if(d.user.role!=='ADMIN')throw Error('Akun bukan ADMIN.');saveAuth(d);$('loginPage').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=d.user.nama;load()}catch(e){toast(e.message)}}async function load(){const a=getAuth();try{D=await api('adminDashboard',{authToken:a.authToken});if(!D.success)throw Error(D.message);render()}catch(e){toast(e.message)}}function render(){const active=D.sessions.filter(x=>['AKTIF','DIKUNCI'].includes(String(x.STATUS))).length;const done=D.sessions.filter(x=>['SUBMITTED','SELESAI'].includes(String(x.STATUS))).length;$('metrics').innerHTML=[['Kegiatan',D.schedules.length],['Proktor',D.proctors.filter(x=>x.ROLE==='PROKTOR').length],['Peserta',D.students.length],['Sesi aktif',active]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('');$('recent').innerHTML='<div class="card" style="margin-top:14px"><b>Aktivitas sesi terakhir</b>'+table(D.sessions.slice(0,10),['SESSION_ID','NOMOR_PESERTA','NAMA','RUANG_ID','STATUS','JUMLAH_PELANGGARAN'])+'</div>';renderSchedule();renderProctor();renderRoom();renderMonitor()}function table(arr,cols){return `<div class="table-wrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${arr.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function renderSchedule(){$('scheduleTable').innerHTML=table(D.schedules,['ID_JADWAL','TANGGAL','KELAS','RUANG_ID','PROKTOR_ID','MAPEL','MULAI','SELESAI','TOKEN','STATUS'])}function renderProctor(){$('proctorTable').innerHTML=table(D.proctors,['ID_PENGAWAS','USERNAME','NAMA','ROLE','RUANG_ID','STATUS'])}function renderRoom(){$('roomTable').innerHTML=table(D.rooms,['ID_RUANG','NAMA_RUANG','PROKTOR_ID','STATUS'])}function renderMonitor(){$('monitorTable').innerHTML=table(D.violations,['WAKTU','NOMOR_PESERTA','RUANG_ID','JENIS','DETAIL','TINDAKAN','STATUS'])}function fillSelects(){const rs=D.rooms.filter(x=>x.STATUS==='AKTIF');$('sroom').innerHTML=rs.map(x=>`<option value="${esc(x.ID_RUANG)}">${esc(x.NAMA_RUANG)}</option>`).join('');$('proom').innerHTML=rs.map(x=>`<option value="${esc(x.ID_RUANG)}">${esc(x.NAMA_RUANG)}</option>`).join('');$('sproctor').innerHTML=D.proctors.filter(x=>x.ROLE==='PROKTOR').map(x=>`<option value="${esc(x.ID_PENGAWAS)}">${esc(x.NAMA)} (${esc(x.RUANG_ID)})</option>`).join('')}async function generateToken(id){if(!id){toast('Isi ID Jadwal terlebih dahulu atau simpan jadwal.');return}const a=getAuth();try{const d=await api('adminGenerateToken',{authToken:a.authToken,idJadwal:id});if(!d.success)throw Error(d.message);$('stoken').value=d.token;toast('Token baru: '+d.token);await load()}catch(e){toast(e.message)}}async function saveSchedule(){const a=getAuth(),d={ID_JADWAL:$('sid').value,TANGGAL:$('sdate').value,KELAS:$('sclass').value,RUANG_ID:$('sroom').value,PROKTOR_ID:$('sproctor').value,MAPEL:$('ssubject').value,MULAI:$('sstart').value,SELESAI:$('send').value,TOKEN:$('stoken').value,GOOGLE_FORM_URL:$('sform').value,STATUS:$('sstatus').value};try{const r=await api('adminSaveSchedule',{authToken:a.authToken,data:d});if(!r.success)throw Error(r.message);toast('Jadwal tersimpan');await load()}catch(e){toast(e.message)}}async function saveProctor(){const a=getAuth(),d={ID_PENGAWAS:$('pid').value,USERNAME:$('puser').value,NAMA:$('pname').value,PIN:$('ppin').value,ROLE:'PROKTOR',RUANG_ID:$('proom').value,STATUS:$('pstatus').value};try{const r=await api('adminSaveProctor',{authToken:a.authToken,data:d});if(!r.success)throw Error(r.message);toast('Proktor tersimpan');await load()}catch(e){toast(e.message)}}async function saveRoom(){const a=getAuth(),d={ID_RUANG:$('rid').value,NAMA_RUANG:$('rname').value,PROKTOR_ID:$('rproctor').value,STATUS:$('rstatus').value};try{const r=await api('adminSaveRoom',{authToken:a.authToken,data:d});if(!r.success)throw Error(r.message);toast('Ruang tersimpan');await load()}catch(e){toast(e.message)}}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$(b.dataset.tab).classList.add('active')});const old= getAuth();if(old&&old.user?.role==='ADMIN'){$('loginPage').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=old.user.nama;load()}setTimeout(()=>{if(D)fillSelects()},1000);const _render=render;render=function(){_render();fillSelects()};
</script></body></html>
