<!doctype html>
<html lang="id">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CBT Proktor</title>

<script src="config.js"></script>
<script src="app.js"></script>

<style>
:root{
  --navy:#071737;
  --blue:#1f50f5;
  --lime:#c8ff00;
  --soft:#f4f7fc;
  --line:#dbe2f1;
  --ink:#12213e;
  --muted:#69758e;
  --red:#c7352e;
  --green:#16794b;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#102b68,#07132f);
  color:var(--ink);
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.wrap{
  padding:18px;
  min-height:100vh;
}

.app{
  max-width:1200px;
  margin:auto;
  background:white;
  border-radius:22px;
  overflow:hidden;
  min-height:calc(100vh - 36px);
  box-shadow:0 24px 80px #05194540;
}

/* ================================
   LOGIN
================================ */

.login{
  width:calc(100% - 32px);
  max-width:430px;
  margin:80px auto;
  background:#fff;
  padding:28px;
  border-radius:20px;
  box-shadow:0 24px 80px #05194555;
}

.login h1{
  margin:0 0 8px;
  font-size:27px;
}

.login .muted{
  margin-bottom:22px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:10px;
  font-weight:800;
  margin-bottom:6px;
}

.field input{
  width:100%;
  height:44px;
  border:1px solid var(--line);
  border-radius:9px;
  padding:0 11px;
  background:#f7f9fd;
  outline:none;
}

.field input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px #1f50f515;
}

.hidden{
  display:none !important;
}

/* ================================
   HEADER
================================ */

.top{
  background:#102b8f;
  color:white;
  padding:17px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.top b{
  font-size:14px;
  letter-spacing:.3px;
}

.top small{
  display:block;
  color:#cdd8ff;
  margin-top:4px;
  font-size:10px;
}

/* ================================
   MAIN
================================ */

.main{
  padding:20px;
}

.page-head{
  display:flex;
  align-items:center;
  gap:10px;
}

.page-title{
  min-width:0;
}

.page-title h2{
  margin:0;
  font-size:20px;
}

.refresh{
  margin-left:auto;
}

/* ================================
   BUTTON
================================ */

.btn{
  border:0;
  border-radius:9px;
  padding:9px 12px;
  font-weight:850;
  cursor:pointer;
  transition:.15s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn:active{
  transform:translateY(0);
}

.primary{
  background:var(--lime);
  color:#07152d;
}

.secondary{
  background:#e7ecf5;
  color:#263653;
}

.danger{
  background:#ffe9e7;
  color:#9f261f;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none;
}

/* ================================
   METRICS
================================ */

.cards{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.card{
  border:1px solid var(--line);
  border-radius:13px;
  padding:14px;
  background:white;
}

.metric{
  font-size:24px;
  font-weight:950;
  margin-top:3px;
}

.muted{
  font-size:10px;
  color:var(--muted);
}

/* ================================
   TABLE
================================ */

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:12px;
  margin-top:14px;
}

.table{
  width:100%;
  min-width:850px;
  border-collapse:collapse;
  font-size:10px;
}

.table th,
.table td{
  padding:9px;
  border-bottom:1px solid var(--line);
  text-align:left;
  vertical-align:middle;
}

.table th{
  background:#f5f7fc;
  font-weight:900;
  white-space:nowrap;
}

.table tr:last-child td{
  border-bottom:0;
}

.danger-row{
  background:#fff8f7;
}

/* ================================
   STATUS PILL
================================ */

.pill{
  display:inline-block;
  padding:4px 7px;
  border-radius:99px;
  font-weight:900;
  font-size:8px;
  white-space:nowrap;
}

.ok{
  background:#e9f8f0;
  color:#16794b;
}

.bad{
  background:#fff0ef;
  color:#a32b24;
}

.warn{
  background:#fff7df;
  color:#805b11;
}

/* ================================
   ACTIONS
================================ */

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

/* ================================
   TOAST
================================ */

.toast{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translate(-50%,20px);
  opacity:0;
  background:#172747;
  color:#fff;
  padding:11px 15px;
  border-radius:10px;
  font-size:11px;
  transition:.2s;
  z-index:9999;
  pointer-events:none;
  box-shadow:0 8px 30px #0003;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* ================================
   LOADING
================================ */

.loading{
  padding:30px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
}

.spinner{
  width:22px;
  height:22px;
  border:3px solid #dfe5f2;
  border-top-color:var(--blue);
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:0 auto 9px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* ================================
   SESSION INFO
================================ */

.session-info{
  margin-top:10px;
  padding:9px 11px;
  background:#f4f7fc;
  border:1px solid var(--line);
  border-radius:9px;
  font-size:9px;
  color:var(--muted);
}

/* ================================
   RESPONSIVE
================================ */

@media(max-width:800px){

  .wrap{
    padding:0;
  }

  .app{
    border-radius:0;
    min-height:100vh;
  }

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .top{
    padding:14px;
  }

  .main{
    padding:14px;
  }

  .page-title h2{
    font-size:17px;
  }

  .login{
    margin:50px auto;
  }
}

@media(max-width:480px){

  .cards{
    gap:8px;
  }

  .card{
    padding:12px;
  }

  .metric{
    font-size:21px;
  }

  .actions .btn{
    padding:7px 9px;
    font-size:10px;
  }
}
</style>

</head>

<body>

<!-- ============================================================
     LOGIN PAGE
============================================================ -->

<div id="loginPage" class="login">

  <h1>CBT Proktor</h1>

  <p class="muted">
    Login ini terikat ke satu ruang/lab.
  </p>

  <div class="field">
    <label>Username</label>
    <input
      id="username"
      autocomplete="username"
      value="proktor01"
    >
  </div>

  <div class="field">
    <label>PIN</label>
    <input
      id="pin"
      type="password"
      autocomplete="current-password"
      value="123456"
      onkeydown="if(event.key==='Enter')login()"
    >
  </div>

  <button
    id="loginButton"
    class="btn primary"
    style="width:100%"
    onclick="login()"
  >
    Masuk Proktor
  </button>

  <div id="loginStatus" class="muted" style="margin-top:12px;text-align:center"></div>

</div>


<!-- ============================================================
     APPLICATION
============================================================ -->

<div id="app" class="wrap hidden">

  <div class="app">

    <!-- HEADER -->

    <header class="top">

      <div>
        <b>CBT PROKTOR</b>
        <small id="who"></small>
      </div>

      <button
        class="btn secondary"
        onclick="logoutAuth()"
      >
        Keluar
      </button>

    </header>


    <!-- MAIN -->

    <main class="main">

      <!-- PAGE HEADER -->

      <div class="page-head">

        <div class="page-title">

          <h2 id="scheduleTitle">
            Memuat...
          </h2>

          <div id="scheduleInfo" class="muted">
            Memuat informasi jadwal...
          </div>

        </div>

        <button
          class="btn secondary refresh"
          onclick="load()"
        >
          ↻ Refresh
        </button>

      </div>


      <!-- SESSION INFO -->

      <div id="sessionInfo" class="session-info">
        Session proktor aktif.
      </div>


      <!-- METRICS -->

      <div
        id="metrics"
        class="cards"
        style="margin-top:16px"
      ></div>


      <!-- PARTICIPANTS -->

      <h3>
        Peserta Ruangan
      </h3>

      <div id="students">

        <div class="loading">
          <div class="spinner"></div>
          Memuat peserta...
        </div>

      </div>


      <!-- VIOLATIONS -->

      <h3 style="margin-top:22px">
        Pelanggaran Terbaru
      </h3>

      <div id="violations">

        <div class="loading">
          Memuat pelanggaran...
        </div>

      </div>

    </main>

  </div>

</div>


<!-- TOAST -->

<div id="toast" class="toast"></div>


<script>

/* ============================================================
   GLOBAL STATE
============================================================ */

let D = null;

let loadingDashboard = false;


/* ============================================================
   SESSION CONFIGURATION
============================================================ */

/*
   Semua data session proktor disimpan di localStorage.

   Key utama:
   CBT_PROKTOR_SESSION

   TTL:
   12 jam.

   Jika backend mempunyai masa berlaku token yang lebih pendek,
   backend tetap menjadi sumber validasi utama.
*/

const SESSION_KEY = 'CBT_PROKTOR_SESSION';

const SESSION_TTL = 12 * 60 * 60 * 1000;


/* ============================================================
   HELPER ELEMENT
============================================================ */

function $(id){

  return document.getElementById(id);

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function esc(x){

  return String(x ?? '').replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );

}


/* ============================================================
   TOAST
============================================================ */

let toastTimer = null;

function toast(message){

  const el = $('toast');

  if(!el)return;

  el.textContent = message;

  el.classList.add('show');

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {

    el.classList.remove('show');

  },3000);

}


/* ============================================================
   SESSION CACHE
============================================================ */

/*
   Menyimpan session ke browser.

   Contoh data:

   {
      authToken: "...",
      user: {
         username: "...",
         nama: "...",
         role: "PROKTOR",
         ruangId: "LAB-01"
      },
      loginAt: 123456789,
      lastActive: 123456789
   }
*/

function saveProctorSession(data){

  try{

    if(!data || !data.authToken || !data.user){

      throw new Error('Data session tidak lengkap.');

    }

    const session = {

      authToken:data.authToken,

      user:data.user,

      loginAt:Date.now(),

      lastActive:Date.now()

    };

    localStorage.setItem(
      SESSION_KEY,
      JSON.stringify(session)
    );

    /*
       Jika app.js juga mempunyai saveAuth(),
       kita tetap panggil agar kompatibel dengan
       sistem authentication yang sudah ada.
    */

    if(typeof saveAuth === 'function'){

      try{

        saveAuth(data);

      }catch(e){

        console.warn(
          'saveAuth() gagal:',
          e
        );

      }

    }

  }catch(e){

    console.error(
      'Gagal menyimpan session:',
      e
    );

  }

}


/* ============================================================
   GET SESSION
============================================================ */

function getProctorSession(){

  try{

    const raw = localStorage.getItem(
      SESSION_KEY
    );

    if(!raw){

      return null;

    }

    const session = JSON.parse(raw);

    if(
      !session ||
      !session.authToken ||
      !session.user
    ){

      clearProctorSession();

      return null;

    }

    /*
       Cek umur cache.

       Cache hanya dipakai untuk memulihkan tampilan/login.
       Token tetap harus divalidasi oleh server.
    */

    const lastActive =
      Number(session.lastActive || 0);

    if(
      lastActive &&
      Date.now() - lastActive > SESSION_TTL
    ){

      clearProctorSession();

      return null;

    }

    return session;

  }catch(e){

    console.error(
      'Session browser rusak:',
      e
    );

    clearProctorSession();

    return null;

  }

}


/* ============================================================
   UPDATE SESSION ACTIVITY
============================================================ */

function touchProctorSession(){

  try{

    const session =
      getProctorSession();

    if(!session)return;

    session.lastActive = Date.now();

    localStorage.setItem(
      SESSION_KEY,
      JSON.stringify(session)
    );

  }catch(e){

    console.warn(
      'Tidak dapat memperbarui session:',
      e
    );

  }

}


/* ============================================================
   CLEAR SESSION
============================================================ */

function clearProctorSession(){

  try{

    localStorage.removeItem(
      SESSION_KEY
    );

  }catch(e){

    console.warn(
      'Gagal menghapus session:',
      e
    );

  }

  /*
     Hapus juga session lama dari app.js
     jika tersedia.
  */

  try{

    if(typeof clearAuth === 'function'){

      clearAuth();

    }

  }catch(e){

    console.warn(
      'clearAuth() gagal:',
      e
    );

  }

  /*
     Beberapa versi app.js mungkin menggunakan
     localStorage key EB_SESSION atau AUTH_SESSION.
     Kita tidak menghapus data lain secara sembarangan.
  */

}


/* ============================================================
   SHOW LOGIN
============================================================ */

function showLogin(){

  $('loginPage').classList.remove(
    'hidden'
  );

  $('app').classList.add(
    'hidden'
  );

  $('loginStatus').textContent = '';

}


/* ============================================================
   SHOW APPLICATION
============================================================ */

function showApp(user){

  $('loginPage').classList.add(
    'hidden'
  );

  $('app').classList.remove(
    'hidden'
  );

  if(user){

    $('who').textContent =
      `${user.nama || user.username || ''} · ${user.ruangId || ''}`;

  }

}


/* ============================================================
   LOGIN
============================================================ */

async function login(){

  const username =
    $('username').value.trim();

  const pin =
    $('pin').value;

  if(!username){

    toast('Username wajib diisi.');

    $('username').focus();

    return;

  }

  if(!pin){

    toast('PIN wajib diisi.');

    $('pin').focus();

    return;

  }


  const button =
    $('loginButton');

  const status =
    $('loginStatus');


  button.disabled = true;

  button.textContent =
    'Memeriksa...';

  status.textContent =
    'Menghubungkan ke server...';


  try{

    /*
       Hash PIN sebelum dikirim.
    */

    const h =
      await sha256(pin);


    /*
       Login ke backend.
    */

    const d =
      await api(
        'login',
        {
          username:username,
          pinHash:h,
          device:device()
        }
      );


    if(!d || !d.success){

      throw new Error(
        d?.message ||
        'Login gagal.'
      );

    }


    /*
       Pastikan akun benar-benar PROKTOR.
    */

    if(
      !d.user ||
      d.user.role !== 'PROKTOR'
    ){

      throw new Error(
        'Akun bukan PROKTOR.'
      );

    }


    /*
       Simpan session ke browser.
    */

    saveProctorSession(d);


    /*
       Bersihkan PIN dari input.
    */

    $('pin').value = '';


    /*
       Tampilkan aplikasi.
    */

    showApp(d.user);


    status.textContent = '';

    toast(
      'Login berhasil. Session tersimpan.'
    );


    /*
       Load dashboard.
    */

    await load();


  }catch(e){

    console.error(
      'LOGIN ERROR:',
      e
    );

    toast(
      e.message ||
      'Login gagal.'
    );

    status.textContent =
      'Login gagal. Periksa username, PIN, atau koneksi.';


  }finally{

    button.disabled = false;

    button.textContent =
      'Masuk Proktor';

  }

}


/* ============================================================
   RESTORE SESSION
============================================================ */

/*
   Fungsi ini dijalankan ketika halaman pertama kali dibuka.

   Alurnya:

   Browser
       ↓
   localStorage
       ↓
   Ambil authToken
       ↓
   Coba akses dashboard
       ↓
   Server memvalidasi token
       ↓
   Jika valid → masuk otomatis
   Jika invalid → hapus cache → login
*/

async function restoreSession(){

  const session =
    getProctorSession();


  /*
     Tidak ada cache session.
  */

  if(!session){

    showLogin();

    return;

  }


  /*
     Pastikan role tetap PROKTOR.
  */

  if(
    session.user?.role !== 'PROKTOR'
  ){

    clearProctorSession();

    showLogin();

    return;

  }


  /*
     Tampilkan app sementara dashboard
     sedang divalidasi.
  */

  showApp(session.user);


  $('sessionInfo').textContent =
    'Memulihkan session proktor...';


  try{

    /*
       Gunakan token yang tersimpan.
    */

    const d =
      await api(
        'proctorDashboard',
        {
          authToken:session.authToken
        }
      );


    /*
       Jika token invalid.
    */

    if(!d || !d.success){

      throw new Error(
        d?.message ||
        'Session sudah tidak valid.'
      );

    }


    /*
       Session valid.

       Perbarui waktu aktivitas.
    */

    touchProctorSession();


    /*
       Simpan data dashboard.
    */

    D = d;


    /*
       Render dashboard.
    */

    render();


    toast(
      'Session berhasil dipulihkan.'
    );


  }catch(e){

    console.warn(
      'Restore session gagal:',
      e
    );


    /*
       Token tidak valid.

       Jangan terus menggunakan session lama.
    */

    clearProctorSession();

    D = null;

    showLogin();


    toast(
      'Session berakhir. Silakan login kembali.'
    );

  }

}


/* ============================================================
   GET AUTH
============================================================ */

/*
   Fungsi ini digunakan semua action dashboard.

   Prioritas:
   1. Session baru CBT_PROKTOR_SESSION
   2. getAuth() dari app.js sebagai fallback
*/

function getProctorAuth(){

  const session =
    getProctorSession();

  if(session){

    touchProctorSession();

    return {

      authToken:session.authToken,

      user:session.user

    };

  }


  /*
     Fallback untuk kompatibilitas
     dengan app.js lama.
  */

  try{

    if(typeof getAuth === 'function'){

      const old =
        getAuth();

      if(
        old &&
        old.authToken &&
        old.user?.role === 'PROKTOR'
      ){

        return old;

      }

    }

  }catch(e){

    console.warn(
      'getAuth() gagal:',
      e
    );

  }

  return null;

}


/* ============================================================
   LOAD DASHBOARD
============================================================ */

async function load(){

  if(loadingDashboard){

    return;

  }


  const a =
    getProctorAuth();


  if(!a){

    showLogin();

    return;

  }


  loadingDashboard = true;


  try{

    /*
       Jika belum ada data dashboard,
       tampilkan loading.
    */

    if(!D){

      $('students').innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          Memuat peserta...
        </div>
      `;

      $('violations').innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          Memuat pelanggaran...
        </div>
      `;

    }


    const result =
      await api(
        'proctorDashboard',
        {
          authToken:a.authToken
        }
      );


    if(
      !result ||
      !result.success
    ){

      const msg =
        result?.message ||
        'Gagal memuat dashboard.';


      /*
         Jika server mengatakan token invalid,
         hapus session browser.
      */

      if(
        /token|session|auth|login/i.test(msg)
      ){

        clearProctorSession();

        D = null;

        showLogin();

      }

      throw new Error(msg);

    }


    /*
       Dashboard berhasil.
    */

    D = result;


    /*
       Session masih aktif.
    */

    touchProctorSession();


    render();


  }catch(e){

    console.error(
      'LOAD ERROR:',
      e
    );

    toast(
      e.message ||
      'Gagal memuat dashboard.'
    );


  }finally{

    loadingDashboard = false;

  }

}


/* ============================================================
   RENDER DASHBOARD
============================================================ */

function render(){

  if(!D){

    return;

  }


  const ss =
    Array.isArray(D.sessions)
      ? D.sessions
      : [];


  const students =
    Array.isArray(D.students)
      ? D.students
      : [];


  const violations =
    Array.isArray(D.violations)
      ? D.violations
      : [];


  /*
     Hitung status peserta.
  */

  const active =
    ss.filter(
      s =>
        String(s.STATUS) === 'AKTIF'
    ).length;


  const locked =
    ss.filter(
      s =>
        String(s.STATUS) === 'DIKUNCI'
    ).length;


  const done =
    ss.filter(
      s =>
        [
          'SUBMITTED',
          'SELESAI'
        ].includes(
          String(s.STATUS)
        )
    ).length;


  const online =
    ss.filter(
      s =>
        [
          'AKTIF',
          'DIKUNCI'
        ].includes(
          String(s.STATUS)
        )
    ).length;


  /*
     Jadwal.
  */

  $('scheduleTitle').textContent =
    D.schedule
      ? `${D.schedule.MAPEL} · ${D.schedule.KELAS}`
      : 'Belum ada jadwal';


  $('scheduleInfo').textContent =
    D.schedule
      ? `${D.schedule.TANGGAL} · ${D.schedule.MULAI}–${D.schedule.SELESAI} · ${D.schedule.RUANG_ID} · Token ${D.schedule.TOKEN}`
      : 'Tidak ada jadwal aktif untuk ruang ini';


  /*
     Session info.
  */

  const session =
    getProctorSession();


  if(session){

    const loginTime =
      session.loginAt
        ? new Date(
            session.loginAt
          ).toLocaleString(
            'id-ID'
          )
        : '—';


    $('sessionInfo').textContent =
      `Session aktif · Login ${loginTime} · Ruang ${session.user?.ruangId || '—'}`;

  }


  /*
     Metrics.
  */

  $('metrics').innerHTML = [

    ['Peserta',students.length],

    ['Online',online],

    ['Aktif',active],

    ['Terkunci',locked],

    ['Selesai',done]

  ].map(
    x => `
      <div class="card">

        <div class="muted">
          ${esc(x[0])}
        </div>

        <div class="metric">
          ${esc(x[1])}
        </div>

      </div>
    `
  ).join('');


  /*
     Mapping session berdasarkan nomor peserta.
  */

  const byNo = {};


  ss.forEach(
    s => {

      byNo[
        s.NOMOR_PESERTA
      ] = s;

    }
  );


  /*
     Tabel peserta.
  */

  $('students').innerHTML = `

    <div class="table-wrap">

      <table class="table">

        <thead>

          <tr>

            <th>No</th>

            <th>Peserta</th>

            <th>Nama</th>

            <th>Kelas</th>

            <th>Status</th>

            <th>Pelanggaran</th>

            <th>Terakhir</th>

            <th>Aksi</th>

          </tr>

        </thead>

        <tbody>

          ${
            students.length
            ?
            students.map(
              (st,i) => {

                const s =
                  byNo[
                    st.NOMOR_PESERTA
                  ];


                const status =
                  s
                    ? s.STATUS
                    : 'BELUM LOGIN';


                const cls =
                  status === 'AKTIF'
                    ? 'ok'
                    : status === 'DIKUNCI'
                    ? 'bad'
                    : status === 'SUBMITTED'
                    ? 'ok'
                    : 'warn';


                const violationCount =
                  s
                    ? Number(
                        s.JUMLAH_PELANGGARAN || 0
                      )
                    : 0;


                return `

                  <tr
                    class="${
                      status === 'DIKUNCI'
                        ? 'danger-row'
                        : ''
                    }"
                  >

                    <td>
                      ${i + 1}
                    </td>

                    <td>
                      ${esc(
                        st.NOMOR_PESERTA
                      )}
                    </td>

                    <td>
                      ${esc(
                        st.NAMA
                      )}
                    </td>

                    <td>
                      ${esc(
                        st.KELAS
                      )}
                    </td>

                    <td>

                      <span
                        class="pill ${cls}"
                      >
                        ${esc(status)}
                      </span>

                    </td>

                    <td>
                      ${violationCount}
                    </td>

                    <td>
                      ${esc(
                        s
                          ? s.LAST_SEEN
                          : '—'
                      )}
                    </td>

                    <td>

                      ${
                        s

                        ?

                        `
                        <div class="actions">

                          ${
                            status === 'DIKUNCI'

                            ?

                            `
                            <button
                              class="btn primary"
                              onclick="action(
                                'proctorUnlock',
                                '${esc(s.SESSION_ID)}'
                              )"
                            >
                              Buka
                            </button>
                            `

                            :

                            `
                            <button
                              class="btn danger"
                              onclick="action(
                                'proctorLock',
                                '${esc(s.SESSION_ID)}'
                              )"
                            >
                              Kunci
                            </button>
                            `
                          }

                          <button
                            class="btn secondary"
                            onclick="warn(
                              '${esc(s.SESSION_ID)}'
                            )"
                          >
                            Peringatkan
                          </button>

                        </div>
                        `

                        :

                        '—'
                      }

                    </td>

                  </tr>

                `;

              }
            ).join('')

            :

            `
              <tr>
                <td
                  colspan="8"
                  style="text-align:center;padding:25px"
                >
                  Tidak ada peserta.
                </td>
              </tr>
            `
          }

        </tbody>

      </table>

    </div>

  `;


  /*
     Pelanggaran.
  */

  $('violations').innerHTML =
    table(
      violations.slice(0,30),
      [
        'WAKTU',
        'NOMOR_PESERTA',
        'JENIS',
        'DETAIL',
        'LEVEL',
        'TINDAKAN',
        'STATUS'
      ]
    );

}


/* ============================================================
   GENERIC TABLE
============================================================ */

function table(
  arr,
  cols
){

  if(
    !Array.isArray(arr) ||
    !arr.length
  ){

    return `
      <div class="table-wrap">

        <div
          style="
            padding:25px;
            text-align:center;
            color:#69758e;
            font-size:10px;
          "
        >
          Belum ada data.
        </div>

      </div>
    `;

  }


  return `

    <div class="table-wrap">

      <table class="table">

        <thead>

          <tr>

            ${
              cols.map(
                c => `
                  <th>
                    ${esc(c)}
                  </th>
                `
              ).join('')
            }

          </tr>

        </thead>

        <tbody>

          ${
            arr.map(
              r => `

                <tr>

                  ${
                    cols.map(
                      c => `
                        <td>
                          ${esc(
                            r?.[c]
                          )}
                        </td>
                      `
                    ).join('')
                  }

                </tr>

              `
            ).join('')
          }

        </tbody>

      </table>

    </div>

  `;

}


/* ============================================================
   LOCK / UNLOCK
============================================================ */

async function action(
  act,
  sid
){

  const a =
    getProctorAuth();


  if(!a){

    showLogin();

    return;

  }


  if(!sid){

    toast(
      'Session peserta tidak ditemukan.'
    );

    return;

  }


  const message =
    act === 'proctorUnlock'
      ? 'Buka kembali sesi peserta ini?'
      : 'Kunci sesi peserta ini?';


  if(!confirm(message)){

    return;

  }


  try{

    const d =
      await api(
        act,
        {
          authToken:a.authToken,

          sessionId:sid,

          device:device()
        }
      );


    if(
      !d ||
      !d.success
    ){

      throw new Error(
        d?.message ||
        'Aksi gagal.'
      );

    }


    toast(
      act === 'proctorUnlock'
        ? 'Sesi dibuka.'
        : 'Sesi dikunci.'
    );


    /*
       Refresh dashboard.
    */

    await load();


  }catch(e){

    console.error(
      'ACTION ERROR:',
      e
    );

    toast(
      e.message ||
      'Aksi gagal.'
    );

  }

}


/* ============================================================
   WARNING
============================================================ */

async function warn(
  sid
){

  if(!sid){

    toast(
      'Session peserta tidak ditemukan.'
    );

    return;

  }


  const reason =
    prompt(
      'Catatan peringatan untuk siswa:',
      'Harap kembali fokus pada halaman ujian.'
    );


  if(reason === null){

    return;

  }


  if(!reason.trim()){

    toast(
      'Catatan peringatan tidak boleh kosong.'
    );

    return;

  }


  const a =
    getProctorAuth();


  if(!a){

    showLogin();

    return;

  }


  try{

    const d =
      await api(
        'proctorWarn',
        {
          authToken:a.authToken,

          sessionId:sid,

          reason:reason.trim(),

          device:device()
        }
      );


    if(
      !d ||
      !d.success
    ){

      throw new Error(
        d?.message ||
        'Peringatan gagal dicatat.'
      );

    }


    toast(
      'Peringatan dicatat.'
    );


    await load();


  }catch(e){

    console.error(
      'WARNING ERROR:',
      e
    );

    toast(
      e.message ||
      'Peringatan gagal dicatat.'
    );

  }

}


/* ============================================================
   LOGOUT
============================================================ */

function logoutAuth(){

  if(
    !confirm(
      'Keluar dari akun Proktor?'
    )
  ){

    return;

  }


  /*
     Hapus session browser.
  */

  clearProctorSession();


  /*
     Reset state.
  */

  D = null;


  /*
     Reset dashboard.
  */

  $('scheduleTitle').textContent =
    'Memuat...';

  $('scheduleInfo').textContent =
    '';

  $('metrics').innerHTML =
    '';

  $('students').innerHTML =
    '';

  $('violations').innerHTML =
    '';


  /*
     Tampilkan login.
  */

  showLogin();


  /*
     Bersihkan input PIN.
  */

  $('pin').value = '';


  toast(
    'Anda telah keluar.'
  );

}


/* ============================================================
   ACTIVITY TRACKING
============================================================ */

/*
   Setiap aktivitas pada halaman akan memperpanjang
   waktu cache session.

   Catatan:
   ini hanya memperbarui waktu cache lokal.
   Validitas token tetap ditentukan oleh server.
*/

[
  'click',
  'keydown',
  'touchstart'
].forEach(
  eventName => {

    document.addEventListener(
      eventName,
      () => {

        if(
          !$('app').classList.contains(
            'hidden'
          )
        ){

          touchProctorSession();

        }

      },
      {
        passive:true
      }
    );

  }
);


/* ============================================================
   AUTO REFRESH
============================================================ */

/*
   Dashboard diperbarui setiap 15 detik.
*/

setInterval(
  () => {

    const session =
      getProctorSession();


    if(
      session &&
      !$('app').classList.contains(
        'hidden'
      )
    ){

      load();

    }

  },
  15000
);


/* ============================================================
   TAB / WINDOW FOCUS
============================================================ */

/*
   Ketika proktor kembali ke tab browser,
   dashboard langsung diperbarui.
*/

document.addEventListener(
  'visibilitychange',
  () => {

    if(
      document.visibilityState === 'visible' &&
      !$('app').classList.contains(
        'hidden'
      )
    ){

      const session =
        getProctorSession();


      if(session){

        touchProctorSession();

        load();

      }

    }

  }
);


/* ============================================================
   START APPLICATION
============================================================ */

/*
   Jalankan restore session setelah seluruh
   halaman selesai dimuat.
*/

document.addEventListener(
  'DOMContentLoaded',
  () => {

    restoreSession();

  }
);


/*
   Fallback apabila script ditempatkan
   setelah DOM sudah tersedia.
*/

if(
  document.readyState !== 'loading'
){

  restoreSession();

}

</script>
