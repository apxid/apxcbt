<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CBT Proktor</title><script src="config.js"></script><script src="app.js"></script><style>
:root{--navy:#071737;--blue:#1f50f5;--lime:#c8ff00;--soft:#f4f7fc;--line:#dbe2f1;--ink:#12213e;--muted:#69758e;--red:#c7352e;--green:#16794b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:linear-gradient(135deg,#102b68,#07132f);color:var(--ink)}button,input{font:inherit}.wrap{padding:18px;min-height:100vh}.app{max-width:1200px;margin:auto;background:white;border-radius:22px;overflow:hidden;min-height:calc(100vh - 36px);box-shadow:0 24px 80px #05194540}.top{background:#102b8f;color:white;padding:17px 22px;display:flex;justify-content:space-between;align-items:center}.top small{display:block;color:#cdd8ff;margin-top:4px;font-size:10px}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:850;cursor:pointer}.primary{background:var(--lime);color:#07152d}.secondary{background:#e7ecf5;color:#263653}.danger{background:#ffe9e7;color:#9f261f}.main{padding:20px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{border:1px solid var(--line);border-radius:13px;padding:14px;background:white}.metric{font-size:24px;font-weight:950}.muted{font-size:10px;color:var(--muted)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:14px}.table{width:100%;min-width:850px;border-collapse:collapse;font-size:10px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left}.table th{background:#f5f7fc}.pill{padding:4px 7px;border-radius:99px;font-weight:900;font-size:8px}.ok{background:#e9f8f0;color:#16794b}.bad{background:#fff0ef;color:#a32b24}.warn{background:#fff7df;color:#805b11}.login{max-width:430px;margin:80px auto;background:#fff;padding:28px;border-radius:20px}.field{margin-bottom:12px}.field label{display:block;font-size:10px;font-weight:800;margin-bottom:5px}.field input{width:100%;height:42px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:#f7f9fd}.hidden{display:none}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);opacity:0;background:#172747;color:#fff;padding:11px 15px;border-radius:10px;font-size:11px;transition:.2s;z-index:99}.toast.show{opacity:1;transform:translate(-50%,0)}.actions{display:flex;gap:6px;flex-wrap:wrap}.danger-row{background:#fff8f7}.refresh{margin-left:auto}@media(max-width:800px){.wrap{padding:0}.app{border-radius:0;min-height:100vh}.cards{grid-template-columns:repeat(2,1fr)}.top{padding:14px}.main{padding:14px}}
</style></head><body><div id="loginPage" class="login"><h1>CBT Proktor</h1><p class="muted">Login ini terikat ke satu ruang/lab.</p><div class="field"><label>Username</label><input id="username" value="proktor01"></div><div class="field"><label>PIN</label><input id="pin" type="password" value="123456"></div><button class="btn primary" style="width:100%" onclick="login()">Masuk Proktor</button></div><div id="app" class="wrap hidden"><div class="app"><header class="top"><div><b>CBT PROKTOR</b><small id="who"></small></div><button class="btn secondary" onclick="logoutAuth()">Keluar</button></header><main class="main"><div style="display:flex;align-items:center;gap:10px"><div><h2 id="scheduleTitle" style="margin:0">Memuat...</h2><div id="scheduleInfo" class="muted"></div></div><button class="btn secondary refresh" onclick="load()">↻ Refresh</button></div><div id="metrics" class="cards" style="margin-top:16px"></div><h3>Peserta Ruangan</h3><div id="students"></div><h3 style="margin-top:22px">Pelanggaran Terbaru</h3><div id="violations"></div></main></div></div><div id="toast" class="toast"></div><script>
let D=null;function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function login(){try{const h=await sha256($('pin').value);const d=await api('login',{username:$('username').value,pinHash:h,device:device()});if(!d.success)throw Error(d.message);if(d.user.role!=='PROKTOR')throw Error('Akun bukan PROKTOR.');saveAuth(d);$('loginPage').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=d.user.nama+' · '+d.user.ruangId;load()}catch(e){toast(e.message)}}async function load(){const a=getAuth();if(!a)return;try{D=await api('proctorDashboard',{authToken:a.authToken});if(!D.success)throw Error(D.message);render()}catch(e){toast(e.message)}}function render(){const ss=D.sessions||[],active=ss.filter(s=>s.STATUS==='AKTIF').length,locked=ss.filter(s=>s.STATUS==='DIKUNCI').length,done=ss.filter(s=>['SUBMITTED','SELESAI'].includes(String(s.STATUS))).length,online=ss.filter(s=>['AKTIF','DIKUNCI'].includes(String(s.STATUS))).length;$('scheduleTitle').textContent=D.schedule?`${D.schedule.MAPEL} · ${D.schedule.KELAS}`:'Belum ada jadwal';$('scheduleInfo').textContent=D.schedule?`${D.schedule.TANGGAL} · ${D.schedule.MULAI}–${D.schedule.SELESAI} · ${D.schedule.RUANG_ID} · Token ${D.schedule.TOKEN}`:'Tidak ada jadwal aktif untuk ruang ini';$('metrics').innerHTML=[['Peserta',D.students.length],['Online',online],['Aktif',active],['Terkunci',locked],['Selesai',done]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('');const byNo={};ss.forEach(s=>byNo[s.NOMOR_PESERTA]=s);$('students').innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>No</th><th>Peserta</th><th>Nama</th><th>Kelas</th><th>Status</th><th>Pelanggaran</th><th>Terakhir</th><th>Aksi</th></tr></thead><tbody>${D.students.map((st,i)=>{const s=byNo[st.NOMOR_PESERTA];const status=s?s.STATUS:'BELUM LOGIN';const cls=status==='AKTIF'?'ok':status==='DIKUNCI'?'bad':status==='SUBMITTED'?'ok':'warn';return `<tr class="${status==='DIKUNCI'?'danger-row':''}"><td>${i+1}</td><td>${esc(st.NOMOR_PESERTA)}</td><td>${esc(st.NAMA)}</td><td>${esc(st.KELAS)}</td><td><span class="pill ${cls}">${esc(status)}</span></td><td>${s?s.JUMLAH_PELANGGARAN:0}</td><td>${esc(s?s.LAST_SEEN:'—')}</td><td>${s?`<div class="actions">${status==='DIKUNCI'?`<button class="btn primary" onclick="action('proctorUnlock','${esc(s.SESSION_ID)}')">Buka</button>`:`<button class="btn danger" onclick="action('proctorLock','${esc(s.SESSION_ID)}')">Kunci</button>`}<button class="btn secondary" onclick="warn('${esc(s.SESSION_ID)}')">Peringatkan</button></div>`:'—'}</td></tr>`}).join('')}</tbody></table></div>`;$('violations').innerHTML=table(D.violations.slice(0,30),['WAKTU','NOMOR_PESERTA','JENIS','DETAIL','LEVEL','TINDAKAN','STATUS'])}function table(arr,cols){return `<div class="table-wrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${arr.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}async function action(act,sid){const a=getAuth();try{const d=await api(act,{authToken:a.authToken,sessionId:sid,device:device()});if(!d.success)throw Error(d.message);toast(act==='proctorUnlock'?'Sesi dibuka':'Sesi dikunci');load()}catch(e){toast(e.message)}}async function warn(sid){const reason=prompt('Catatan peringatan untuk siswa:','Harap kembali fokus pada halaman ujian.');if(reason===null)return;const a=getAuth();try{const d=await api('proctorWarn',{authToken:a.authToken,sessionId:sid,reason,device:device()});if(!d.success)throw Error(d.message);toast('Peringatan dicatat');load()}catch(e){toast(e.message)}}function tableStatus(){ }const old=getAuth();if(old&&old.user?.role==='PROKTOR'){$('loginPage').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=old.user.nama+' · '+old.user.ruangId;load()}setInterval(()=>{if(getAuth()&&!$('app').classList.contains('hidden'))load()},15000);
</script></body></html>
